repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: markdown-width
        name: markdown line width
        entry: python3 tools/check_markdown_width.py
        language: system
        types: [markdown]

      - id: project-check
        name: project check
        entry: make check
        language: system
        pass_filenames: false
